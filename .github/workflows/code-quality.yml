name: Code Quality

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.editorconfig'
      - 'coverlet*.runsettings'
      - 'Directory.Build.props'
      - 'F1Competition.sln'
      - '.github/workflows/code-quality.yml'

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            F1Competition.sln

      - name: Restore dependencies
        run: |
          dotnet restore src/F1.Api/F1.Api.csproj
          dotnet restore src/F1.DataSyncWorker/F1.DataSyncWorker.csproj
          dotnet restore src/F1.Web/F1.Web.csproj
          dotnet restore tests/F1.Api.Tests/F1.Api.Tests.csproj
          dotnet restore tests/F1.Web.Tests/F1.Web.Tests.csproj

      - name: Check Formatting
        run: |
          dotnet format whitespace F1Competition.sln --verify-no-changes --no-restore \
          --include src/F1.Api src/F1.Core src/F1.DataSyncWorker src/F1.Infrastructure src/F1.Services src/F1.Web tests/F1.Api.Tests tests/F1.Web.Tests

      - name: Check Analyzer Warnings
        run: |
          dotnet format analyzers F1Competition.sln --verify-no-changes --no-restore --severity warn \
          --include src/F1.Api src/F1.Core src/F1.DataSyncWorker src/F1.Infrastructure src/F1.Services src/F1.Web tests/F1.Api.Tests tests/F1.Web.Tests

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            F1Competition.sln

      - name: Restore dependencies
        run: |
          dotnet restore src/F1.Api/F1.Api.csproj
          dotnet restore src/F1.DataSyncWorker/F1.DataSyncWorker.csproj
          dotnet restore src/F1.Web/F1.Web.csproj
          dotnet restore tests/F1.Api.Tests/F1.Api.Tests.csproj
          dotnet restore tests/F1.Web.Tests/F1.Web.Tests.csproj

      - name: Build & Analyze
        run: |
          dotnet build src/F1.Api/F1.Api.csproj --configuration Release --no-restore /warnaserror
          dotnet build src/F1.DataSyncWorker/F1.DataSyncWorker.csproj --configuration Release --no-restore /warnaserror
          dotnet build src/F1.Web/F1.Web.csproj --configuration Release --no-restore /warnaserror
          dotnet build tests/F1.Api.Tests/F1.Api.Tests.csproj --configuration Release --no-restore /warnaserror
          dotnet build tests/F1.Web.Tests/F1.Web.Tests.csproj --configuration Release --no-restore /warnaserror

      - name: Verify EF Migrations Are Up To Date
        run: |
          dotnet tool install --global dotnet-ef --version 9.* || dotnet tool update --global dotnet-ef --version 9.*
          dotnet ef migrations has-pending-model-changes \
            --project src/F1.Infrastructure/F1.Infrastructure.csproj \
            --startup-project src/F1.Api/F1.Api.csproj \
            --no-build

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            F1Competition.sln

      - name: Restore dependencies
        run: |
          dotnet restore tests/F1.Api.Tests/F1.Api.Tests.csproj
          dotnet restore tests/F1.Web.Tests/F1.Web.Tests.csproj
          dotnet restore tests/F1.Infrastructure.Tests/F1.Infrastructure.Tests.csproj

      - name: Run API Unit Tests with Coverage
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          Database__AutoMigrate: false
        run: |
          dotnet test tests/F1.Api.Tests/F1.Api.Tests.csproj \
            --configuration Debug \
            --nologo \
            --verbosity minimal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.api.runsettings \
            --results-directory ./coverage/api-coverage

      - name: Run Web Unit Tests with Coverage
        run: |
          dotnet test tests/F1.Web.Tests/F1.Web.Tests.csproj \
            --configuration Debug \
            --nologo \
            --verbosity minimal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.web.runsettings \
            --results-directory ./coverage/web-coverage

      - name: Run Preseason Integration Gate with Coverage
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          Database__AutoMigrate: false
        run: |
          dotnet test tests/F1.Infrastructure.Tests/F1.Infrastructure.Tests.csproj \
            --configuration Debug \
            --nologo \
            --verbosity minimal \
            --filter "FullyQualifiedName~MigrationPhil2025CsvContractPolicyTests|FullyQualifiedName~MigrationRaceSelectionParserTests|FullyQualifiedName~MigrationScoreRecalculatorTests|FullyQualifiedName~MigrationImportRunServiceTests" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./coverage/infra-coverage

