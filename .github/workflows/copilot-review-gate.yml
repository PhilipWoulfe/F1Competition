name: Copilot Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-initial-copilot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Copilot review gate disabled
        run: |
          echo "Copilot Review Gate is disabled for this repository."
          echo "This check now passes immediately."
