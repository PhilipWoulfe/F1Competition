name: Copilot Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-initial-copilot-review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Enforce Copilot review on initial PR head
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const copilotLogins = new Set(['github-copilot[bot]']);

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const initialSha = commits.length > 0 ? commits[0].sha : pr.head.sha;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const matchingCopilotReview = reviews.find((review) => {
              const login = review.user?.login;
              const hasBody = typeof review.body === 'string' && review.body.trim().length > 0;
              return copilotLogins.has(login) && hasBody && review.commit_id === initialSha;
            });

            if (!matchingCopilotReview) {
              core.setFailed(
                `Missing Copilot review comment for initial PR SHA ${initialSha}. ` +
                `This gate only accepts Copilot feedback on the initial PR revision.`
              );
              return;
            }

            core.info(
              `Copilot review gate passed with review ${matchingCopilotReview.id} on initial SHA ${initialSha}.`
            );
