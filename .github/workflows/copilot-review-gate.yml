name: Copilot Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  require-copilot-comment:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Enforce at least one Copilot comment
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const copilotLogins = new Set(['github-copilot[bot]']);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const hasCopilotReviewSummary = reviews.some((review) => {
              const login = review.user?.login;
              const hasBody = typeof review.body === 'string' && review.body.trim().length > 0;
              return copilotLogins.has(login) && hasBody;
            });

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const hasCopilotInlineComment = reviewComments.some((comment) => {
              const login = comment.user?.login;
              const hasBody = typeof comment.body === 'string' && comment.body.trim().length > 0;
              return copilotLogins.has(login) && hasBody;
            });

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });

            const hasCopilotIssueComment = issueComments.some((comment) => {
              const login = comment.user?.login;
              const hasBody = typeof comment.body === 'string' && comment.body.trim().length > 0;
              return copilotLogins.has(login) && hasBody;
            });

            if (!hasCopilotReviewSummary && !hasCopilotInlineComment && !hasCopilotIssueComment) {
              core.setFailed(
                'Missing Copilot PR feedback. At least one comment from github-copilot[bot] is required before merge.'
              );
              return;
            }

            core.info('Copilot review gate passed: found at least one Copilot comment on this PR.');
