name: Build and Push F1 Platform

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'F1Competition.sln'
      - 'docker-compose.yml'
      - 'docker-compose.debug.yml'
      - 'infra/**'
      - '.github/workflows/docker-build.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.editorconfig'
      - 'coverlet*.runsettings'
      - 'Directory.Build.props'
      - 'F1Competition.sln'
      # build-and-push is a required check, so workflow-only PRs must still trigger it
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- JOB 1: THE FACTORY (Build, Test, and Push immutable + test tags) ---
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_name_lower: ${{ steps.image-metadata.outputs.image_name_lower }}
      api_sha_tag: ${{ steps.image-metadata.outputs.api_sha_tag }}
      web_sha_tag: ${{ steps.image-metadata.outputs.web_sha_tag }}
      data_sync_sha_tag: ${{ steps.image-metadata.outputs.data_sync_sha_tag }}
      api_changed: ${{ steps.changes.outputs.api }}
      web_changed: ${{ steps.changes.outputs.web }}
      data_sync_changed: ${{ steps.changes.outputs.data_sync }}
      e2e_changed: ${{ steps.changes.outputs.e2e }}
      build_relevant: ${{ steps.change-summary.outputs.build_relevant }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute image metadata
        id: image-metadata
        run: |
          IMAGE_NAME_LOWER="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "IMAGE_NAME_LOWER=$IMAGE_NAME_LOWER" >> "$GITHUB_ENV"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"
          echo "image_name_lower=$IMAGE_NAME_LOWER" >> "$GITHUB_OUTPUT"
          echo "api_sha_tag=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "web_sha_tag=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER-web:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "data_sync_sha_tag=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER-data-sync:$SHA_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/F1.Api/**'
              - 'src/F1.Core/**'
              - 'src/F1.Infrastructure/**'
              - 'src/F1.Services/**'
              - 'tests/F1.Api.Tests/**'
              - 'Directory.Build.props'
              - 'F1Competition.sln'
              - 'src/F1.Api/Dockerfile'
            web:
              - 'src/F1.Web/**'
              - 'src/F1.Core/**'
              - 'src/F1.Services/**'
              - 'tests/F1.Web.Tests/**'
              - 'Directory.Build.props'
              - 'F1Competition.sln'
              - 'src/F1.Web/Dockerfile'
            data_sync:
              - 'src/F1.DataSyncWorker/**'
              - 'src/F1.Core/**'
              - 'src/F1.Infrastructure/**'
              - 'src/F1.Services/**'
              - 'Directory.Build.props'
              - 'F1Competition.sln'
              - 'src/F1.DataSyncWorker/Dockerfile'
            e2e:
              - 'tests/F1.E2E.Tests/**'
              - 'src/F1.Api/**'
              - 'src/F1.Web/**'
              - 'src/F1.Core/**'
              - 'src/F1.Infrastructure/**'
              - 'src/F1.Services/**'
              - 'src/F1.Api/Dockerfile'
              - 'src/F1.Web/Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.debug.yml'

      - name: Summarize required-check scope
        id: change-summary
        run: |
          api_changed="${{ steps.changes.outputs.api }}"
          web_changed="${{ steps.changes.outputs.web }}"
          data_sync_changed="${{ steps.changes.outputs.data_sync }}"
          e2e_changed="${{ steps.changes.outputs.e2e }}"

          if [[ "$api_changed" == "true" || "$web_changed" == "true" || "$data_sync_changed" == "true" ]]; then
            build_relevant=true
          else
            build_relevant=false
          fi

          echo "build_relevant=$build_relevant" >> "$GITHUB_OUTPUT"

          echo "api_changed=$api_changed"
          echo "web_changed=$web_changed"
          echo "data_sync_changed=$data_sync_changed"
          echo "e2e_changed=$e2e_changed"
          echo "build_relevant=$build_relevant"

      - name: Report required-check no-op
        if: github.event_name == 'pull_request' && steps.change-summary.outputs.build_relevant != 'true'
        run: |
          echo "No build-impacting paths changed in this PR."
          echo "Reporting success for the required build-and-push check without running Docker build work."

      - name: Setup .NET
        if: github.event_name != 'pull_request'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            F1Competition.sln

      - name: Run API/Backend Unit Tests with Coverage
        if: github.event_name != 'pull_request'
        run: |
          dotnet test tests/F1.Api.Tests/F1.Api.Tests.csproj \
          --configuration Debug \
          --nologo \
          --verbosity minimal \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.api.runsettings \
          --results-directory ./coverage/api-coverage

      - name: Run Web Unit Tests with Web-Only Coverage
        if: github.event_name != 'pull_request'
        run: |
          dotnet test tests/F1.Web.Tests/F1.Web.Tests.csproj \
          --configuration Debug \
          --nologo \
          --verbosity minimal \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.web.runsettings \
          --results-directory ./coverage/web-coverage

      - name: Code Coverage Summary Report
        if: github.event_name != 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "**/coverage.cobertura.xml"
          badge: true
          fail_below_min: true 
          format: markdown
          output: both
          thresholds: '10 80'

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          install: true

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name != 'pull_request' && (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/F1.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=f1-api-release
          cache-to: type=gha,mode=max,scope=f1-api-release
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.SHA_TAG }}

      - name: Build and push Web image
        if: github.event_name != 'pull_request' && (steps.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: src/F1.Web
          file: src/F1.Web/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=f1-web-release
          cache-to: type=gha,mode=max,scope=f1-web-release
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-web:${{ env.SHA_TAG }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}

      - name: Build and push Data Sync Worker image
        if: github.event_name != 'pull_request' && (steps.changes.outputs.data_sync == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/F1.DataSyncWorker/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=f1-datasync-release
          cache-to: type=gha,mode=max,scope=f1-datasync-release
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-data-sync:${{ env.SHA_TAG }}

      - name: Promote API SHA image to :test tag
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.SHA_TAG }}

      - name: Promote Web SHA image to :test tag
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-web:test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-web:${{ env.SHA_TAG }}

      - name: Promote Data Sync Worker SHA image to :test tag
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.data_sync == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-data-sync:test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-data-sync:${{ env.SHA_TAG }}

  run-e2e-test:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (needs.build-and-push.outputs.e2e_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            F1Competition.sln

      - name: Setup Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Resolve Chrome binary and print versions
        run: |
          set -e
          CHROME_BIN_PATH=""
          if command -v chrome >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v chrome)"
          elif command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            CHROME_BIN_PATH="$(command -v google-chrome-stable)"
          fi

          if [ -z "$CHROME_BIN_PATH" ]; then
            echo "Chrome binary not found in PATH"
            exit 1
          fi

          echo "CHROME_BIN=$CHROME_BIN_PATH" >> "$GITHUB_ENV"
          echo "Using CHROME_BIN=$CHROME_BIN_PATH"
          "$CHROME_BIN_PATH" --version || true
          chromedriver --version || true

      - name: Wait for test deployment to serve current SHA
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
          WEB_CHANGED: ${{ needs.build-and-push.outputs.web_changed }}
          E2E_CF_CLIENT_ID: ${{ secrets.E2E_CF_CLIENT_ID }}
          E2E_CF_CLIENT_SECRET: ${{ secrets.E2E_CF_CLIENT_SECRET }}
          E2E_RACE_ID: ${{ vars.E2E_RACE_ID }}
          E2E_COMPETITION_SLUG: ${{ vars.E2E_COMPETITION_SLUG }}
          E2E_SEASON: ${{ vars.E2E_SEASON }}
          E2E_ROUND: ${{ vars.E2E_ROUND }}
        run: |
          set -euo pipefail

          EXPECTED_SHA_FULL="${GITHUB_SHA}"
          EXPECTED_SHA_SHORT="${GITHUB_SHA::7}"
          BASE_URL="${E2E_BASE_URL%/}"
          API_URL="${E2E_API_BASE_URL%/}"
          RACE_ID="${E2E_RACE_ID:-}"
          COMPETITION_SLUG="${E2E_COMPETITION_SLUG:-main-2026}"
          SEASON="${E2E_SEASON:-2026}"
          ROUND="${E2E_ROUND:-1}"
          WEB_CHANGED="${WEB_CHANGED:-false}"
          WEB_CHECK_REQUIRED=false

          if [ "$WEB_CHANGED" = "true" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            WEB_CHECK_REQUIRED=true
          fi

          [ -n "$BASE_URL" ] || { echo "E2E_BASE_URL is required"; exit 1; }
          [ -n "$API_URL" ] || API_URL="$BASE_URL/api"
          [ -n "${E2E_CF_CLIENT_ID:-}" ] && [ -n "${E2E_CF_CLIENT_SECRET:-}" ] || {
            echo "E2E_CF_CLIENT_ID and E2E_CF_CLIENT_SECRET are required."
            exit 1
          }

          headers=(
            -H "CF-Access-Client-Id: ${E2E_CF_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${E2E_CF_CLIENT_SECRET}"
            -H "Cache-Control: no-cache"
            -H "Pragma: no-cache"
          )

          max_attempts=60
          stable_required=3
          stable_count=0

          for attempt in $(seq 1 "$max_attempts"); do
            web_version="$(curl -fsS --connect-timeout 5 --max-time 15 "${headers[@]}" "$BASE_URL/version.json?ts=$(date +%s)" 2>/dev/null || true)"
            resolved_race_id="$RACE_ID"
            if [ -z "$resolved_race_id" ]; then
              context_response="$(curl -fsS --connect-timeout 5 --max-time 15 "${headers[@]}" "$API_URL/races/context/$COMPETITION_SLUG/$SEASON/round/$ROUND" 2>/dev/null || true)"
              resolved_race_id="$(printf '%s' "$context_response" | sed -n 's/.*"raceId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            fi

            api_config="$(curl -fsS --connect-timeout 5 --max-time 15 "${headers[@]}" "$API_URL/selections/$resolved_race_id/config" 2>/dev/null || true)"
            actual_web_sha="$(printf '%s' "$web_version" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

            web_ok=false
            api_ok=false

            if [ "$WEB_CHECK_REQUIRED" != "true" ]; then
              # Even when not pinning to a specific SHA, ensure the web endpoint is reachable.
              if [ -n "$web_version" ]; then
                web_ok=true
              fi
            elif echo "$web_version" | grep -Eq "$EXPECTED_SHA_FULL|$EXPECTED_SHA_SHORT"; then
              web_ok=true
            fi

            if [ -n "$resolved_race_id" ] && echo "$api_config" | grep -Eq "\"raceId\"[[:space:]]*:[[:space:]]*\"$resolved_race_id\""; then
              api_ok=true
            fi

            echo "Attempt $attempt/$max_attempts: web_ok=$web_ok api_ok=$api_ok web_check_required=$WEB_CHECK_REQUIRED stable_count=$stable_count"
            echo "resolved_race_id=${resolved_race_id:-<none>} context=$COMPETITION_SLUG/$SEASON/round/$ROUND"
            echo "expected_sha_full=$EXPECTED_SHA_FULL expected_sha_short=$EXPECTED_SHA_SHORT actual_web_sha=${actual_web_sha:-<unparsed>}"
            echo "web_version=$web_version"

            if $web_ok && $api_ok; then
              stable_count=$((stable_count + 1))
            else
              stable_count=0
            fi

            if [ "$stable_count" -ge "$stable_required" ]; then
              echo "Deployment is stable on expected SHA and race config."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for deployment. expected_full=$EXPECTED_SHA_FULL expected_short=$EXPECTED_SHA_SHORT"
          echo "Last web version response: $web_version"
          echo "Last API config response: $api_config"
          exit 1

      - name: Run Selenium E2E suite against test
        env:
          E2E_REQUIRED: "true"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
          E2E_CF_CLIENT_ID: ${{ secrets.E2E_CF_CLIENT_ID }}
          E2E_CF_CLIENT_SECRET: ${{ secrets.E2E_CF_CLIENT_SECRET }}
          E2E_RACE_ID: ${{ vars.E2E_RACE_ID }}
          E2E_COMPETITION_SLUG: ${{ vars.E2E_COMPETITION_SLUG }}
          E2E_SEASON: ${{ vars.E2E_SEASON }}
          E2E_ROUND: ${{ vars.E2E_ROUND }}
          E2E_HEADLESS: "true"
          E2E_TIMEOUT_SECONDS: "30"
          E2E_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/e2e/failure-artifacts
          CHROME_BIN: ${{ env.CHROME_BIN }}
          CHROMEDRIVER_LOG: ${{ github.workspace }}/TestResults/e2e/chromedriver.log
        run: |
          dotnet test tests/F1.E2E.Tests/F1.E2E.Tests.csproj \
            --configuration Debug \
            --nologo \
            --verbosity minimal \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory ./TestResults/e2e

      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          retention-days: 5
          path: |
            TestResults/e2e/**
            **/TestResults/e2e/**
            **/chromedriver.log

  # --- JOB 2: THE GATEKEEPER (Promote tested image to :stable) ---
  deploy-prod:
    needs:
      - build-and-push
      - run-e2e-test
    if: github.ref == 'refs/heads/main' && (needs.run-e2e-test.result == 'success' || needs.run-e2e-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # Requires your manual approval click
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote API image to stable
        if: needs.build-and-push.outputs.api_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name_lower }}:stable \
            ${{ needs.build-and-push.outputs.api_sha_tag }}

      - name: Promote Web image to stable
        if: needs.build-and-push.outputs.web_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name_lower }}-web:stable \
            ${{ needs.build-and-push.outputs.web_sha_tag }}

      - name: Promote Data Sync Worker image to stable
        if: needs.build-and-push.outputs.data_sync_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name_lower }}-data-sync:stable \
            ${{ needs.build-and-push.outputs.data_sync_sha_tag }}